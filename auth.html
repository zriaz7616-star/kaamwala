<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>KaamWala — Login</title>
<link rel="stylesheet" href="app.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
  
  * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
  
  body {
    margin: 0; padding: 0; height: 100vh;
    background: #0a0f1c;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }

  /* Animated Background Orbs */
  .orb {
    position: absolute; border-radius: 50%; filter: blur(80px); z-index: 0;
    animation: float 8s infinite ease-in-out;
  }
  .orb-1 { width: 300px; height: 300px; background: rgba(15,118,110,0.6); top: -50px; left: -50px; }
  .orb-2 { width: 250px; height: 250px; background: rgba(14,165,233,0.4); bottom: -50px; right: -50px; animation-delay: -4s; }
  
  @keyframes float {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, 30px); }
  }

  /* Glass Card */
  .auth-card {
    position: relative; z-index: 1;
    width: 100%; max-width: 380px; padding: 32px 24px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    color: #fff;
    margin: 16px;
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-mark {
    width: 50px; height: 50px; background: linear-gradient(135deg, #0F766E, #0EA5E9);
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.2rem; margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(15,118,110,0.5);
    animation: glow 2s infinite alternate;
  }

  @keyframes glow {
    from { box-shadow: 0 0 10px rgba(15,118,110,0.4); }
    to { box-shadow: 0 0 25px rgba(15,118,110,0.8); }
  }

  h1 { margin: 0 0 8px; font-size: 1.6rem; font-weight: 800; }
  p.sub { margin: 0 0 24px; color: rgba(255,255,255,0.6); font-size: 0.9rem; }

  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 6px; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 0.5px;}
  .input-group input {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255,255,255,0.1);
    color: #fff; font-size: 15px; transition: all 0.3s ease;
  }
  .input-group input:focus {
    outline: none; border-color: #0EA5E9;
    box-shadow: 0 0 0 4px rgba(14,165,233,0.2); background: rgba(0, 0, 0, 0.4);
  }

  .auth-btn {
    width: 100%; padding: 15px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #0F766E, #0EA5E9); color: #fff;
    font-weight: 800; font-size: 1rem; cursor: pointer;
    transition: all 0.3s ease; margin-top: 8px;
  }
  .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(15,118,110,0.4); }
  .auth-btn:active { transform: translateY(0); }

  .auth-links {
    display: flex; justify-content: space-between; margin-top: 16px;
    font-size: 0.85rem;
  }
  .auth-links a { color: #0EA5E9; text-decoration: none; font-weight: 600; cursor: pointer;}
  
  .auth-msg {
    margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 0.85rem;
    display: none; font-weight: 600; text-align: center;
  }
  .auth-msg.error { background: rgba(220, 38, 38, 0.2); border: 1px solid rgba(220, 38, 38, 0.5); color: #FCA5A5; display: block; }
  .auth-msg.success { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.5); color: #6EE7B7; display: block; }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="auth-card">
  <div class="logo-mark">KW</div>
  <h1 id="authTitle">Welcome Back</h1>
  <p class="sub" id="authSub">Enter your details to access your invoices.</p>

  <form id="authForm">
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="emailInput" placeholder="you@example.com" required>
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="passInput" placeholder="••••••••" required>
    </div>

    <button type="submit" class="auth-btn" id="submitBtn">Sign In</button>
    
    <div class="auth-links">
      <a id="toggleAuthMode">Create an account</a>
      <a id="forgotPassBtn">Forgot password?</a>
    </div>

    <div class="auth-msg" id="authMsg"></div>
  </form>
</div>

<script src="firebase-app.js"></script>
<script src="firebase-auth.js"></script>
<script src="firebase-firestore.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
(function(){
  'use strict';
  var isSignup = false;
  var $ = function(id){ return document.getElementById(id); };

  function updateUI(){
    $('authTitle').textContent = isSignup ? 'Create Account' : 'Welcome Back';
    $('authSub').textContent = isSignup ? 'Start managing your invoices in seconds.' : 'Enter your details to access your invoices.';
    $('submitBtn').textContent = isSignup ? 'Sign Up' : 'Sign In';
    $('toggleAuthMode').textContent = isSignup ? 'Already have an account? Sign In' : 'Create an account';
    hideMsg();
  }

  $('toggleAuthMode').onclick = function(){ isSignup = !isSignup; updateUI(); };

  function showMsg(type, text){
    var el = $('authMsg');
    el.className = 'auth-msg ' + type;
    el.textContent = text;
  }
  function hideMsg(){ $('authMsg').className = 'auth-msg'; }

  $('authForm').addEventListener('submit', function(e){
    e.preventDefault();
    var email = $('emailInput').value.trim();
    var pass = $('passInput').value;
    if(!email || !pass) return;

    $('submitBtn').disabled = true;
    $('submitBtn').textContent = 'Processing…';
    hideMsg();

    var H = window.KWAuthHelpers;
    var p = isSignup ? H.signUp(email, pass) : H.signIn(email, pass);

    p.then(function(user){
      if (!user.emailVerified && isSignup) {
        showMsg('success', 'Check your email to verify account. Redirecting…');
        setTimeout(function(){ location.href = 'verify.html'; }, 1200);
      } else {
        showMsg('success', 'Login successful! Loading…');
        setTimeout(function(){ location.href = 'home.html'; }, 800);
      }
    }).catch(function(err){
      showMsg('error', window.KWAuthHelpers.friendlyError(err));
      $('submitBtn').disabled = false;
      $('submitBtn').textContent = isSignup ? 'Sign Up' : 'Sign In';
    });
  });

  $('forgotPassBtn').onclick = function(){
    var email = $('emailInput').value.trim();
    if(!email) { showMsg('error', 'Pehle apna email likhein, phir "Forgot Password" dabayein.'); return; }
    $('forgotPassBtn').textContent = 'Sending…';
    window.KWAuthHelpers.sendPasswordReset(email)
      .then(function(){
        showMsg('success', 'Reset link sent! Check your inbox.');
        $('forgotPassBtn').textContent = 'Forgot password?';
      })
      .catch(function(err){
        showMsg('error', window.KWAuthHelpers.friendlyError(err));
        $('forgotPassBtn').textContent = 'Forgot password?';
      });
  };

  // Check if already logged in
  if (window.KWAuthHelpers) {
    window.KWAuthHelpers.onUser(function(user){
      if (user && user.emailVerified) location.href = 'home.html';
    });
  }
})();
</script>
</body>
</html>
