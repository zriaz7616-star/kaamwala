<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>Sign In — KaamWala</title>
<link rel="stylesheet" href="app.css">
<style>
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;background:linear-gradient(180deg,#F0FDFA 0%,#F8FAFC 100%)}
.auth-card{background:#fff;border:1px solid #E2E8F0;border-radius:18px;padding:24px;
  width:100%;max-width:420px;box-shadow:0 10px 40px rgba(15,118,110,.08)}
.auth-brand{text-align:center;margin-bottom:22px}
.auth-logo{display:inline-flex;width:56px;height:56px;align-items:center;justify-content:center;
  background:#0F766E;color:#fff;border-radius:15px;font-size:1.4rem;font-weight:800;
  margin-bottom:12px;letter-spacing:.5px}
.auth-brand h1{margin:0 0 4px;font-size:1.5rem;font-weight:800;color:#0F172A;
  letter-spacing:-.01em}
.auth-brand p{margin:0;color:#64748B;font-size:.9rem}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;
  background:#F1F5F9;border-radius:11px;padding:4px;margin-bottom:18px}
.auth-tab{padding:10px 8px;border:none;background:transparent;border-radius:8px;
  font-weight:700;font-size:.92rem;cursor:pointer;color:#64748B;font-family:inherit;
  min-height:44px}
.auth-tab.is-active{background:#fff;color:#0F766E;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-input{width:100%;padding:13px 14px;border:1.5px solid #CBD5E1;border-radius:11px;
  font-size:16px;background:#fff;color:#0F172A;font-family:inherit;min-height:48px;
  box-sizing:border-box}
.auth-input:focus{outline:none;border-color:#0F766E;box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.auth-submit{background:#0F766E;color:#fff;border:none;padding:14px;border-radius:12px;
  font-weight:800;font-size:1rem;min-height:52px;cursor:pointer;font-family:inherit;
  margin-top:4px}
.auth-submit:active{background:#115E59}
.auth-submit:disabled{opacity:.6;cursor:not-allowed}
.auth-link{display:block;text-align:right;margin-top:-4px;color:#0F766E;
  text-decoration:none;font-weight:600;font-size:.85rem;cursor:pointer;
  background:transparent;border:none;font-family:inherit;padding:6px 0}
.auth-link:hover{text-decoration:underline}
.auth-msg{margin-top:12px;padding:11px 14px;border-radius:10px;font-size:.88rem;
  line-height:1.45;font-weight:600;display:none}
.auth-msg.show{display:block}
.auth-msg.err{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA}
.auth-msg.ok{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0}
.auth-msg.info{background:#EEF2FF;color:#3730A3;border:1px solid #C7D2FE}
.auth-note{background:#FFFBEB;border:1px solid #FDE68A;color:#78350F;
  padding:12px 14px;border-radius:10px;font-size:.82rem;line-height:1.45;margin-top:16px}
.auth-note strong{color:#92400E}

/* Reset modal */
.kw-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.65);z-index:9999;
  display:flex;align-items:center;justify-content:center;padding:16px}
.kw-modal{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:400px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);max-height:90vh;overflow-y:auto}
.kw-modal h3{margin:0 0 8px;font-size:1.15rem;font-weight:800;color:#0F172A}
.kw-modal p{margin:0 0 14px;color:#64748B;font-size:.88rem;line-height:1.5}
.kw-modal input{width:100%;padding:12px 14px;border:1.5px solid #CBD5E1;
  border-radius:11px;font-size:1rem;background:#fff;color:#0F172A;font-family:inherit;
  min-height:48px;box-sizing:border-box}
.kw-modal input:focus{outline:none;border-color:#0F766E;box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.kw-modal .kw-primary{background:#0F766E;color:#fff;border:none;padding:13px;
  border-radius:11px;font-weight:800;font-size:.98rem;min-height:50px;cursor:pointer;
  width:100%;font-family:inherit;margin-top:12px}
.kw-modal .kw-primary:disabled{opacity:.6;cursor:not-allowed}
.kw-modal .kw-secondary{background:#F1F5F9;color:#475569;border:none;padding:12px;
  border-radius:11px;font-weight:700;font-size:.92rem;min-height:48px;cursor:pointer;
  width:100%;font-family:inherit;margin-top:8px}
.kw-msg{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:.84rem;
  text-align:center;font-weight:600;display:none}
.kw-msg.show{display:block}
.kw-msg-err{background:#FEF2F2;color:#991B1B}
.kw-msg-ok{background:#ECFDF5;color:#065F46}
</style>

<meta name="description" content="Sign in or create your free KaamWala account to sync invoices across devices.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://zriaz7616-star.github.io/kaamwala/auth.html">
<meta property="og:title" content="Sign In — KaamWala">
<meta property="og:description" content="Free invoice maker for Pakistani freelancers.">
<meta property="og:url" content="https://zriaz7616-star.github.io/kaamwala/auth.html">
<meta name="theme-color" content="#0F766E">

</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="auth-logo">KW</div>
      <h1>Welcome to KaamWala</h1>
      <p>Sign in to access your invoices anywhere</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab is-active" data-tab="signin">Sign In</button>
      <button class="auth-tab" data-tab="signup">Sign Up</button>
    </div>

    <form class="auth-form" id="authForm" autocomplete="on">
      <input type="email" class="auth-input" id="emailInput" placeholder="Email address" autocomplete="email" required>
      <input type="password" class="auth-input" id="passInput" placeholder="Password (min 6 characters)" autocomplete="current-password" required>

      <button type="button" class="auth-link" id="forgotBtn">Forgot password?</button>

      <button type="submit" class="auth-submit" id="submitBtn">Sign In</button>
      <div class="auth-msg" id="authMsg"></div>
    </form>

    <div class="auth-note">
      <strong>Why sign in?</strong> Your business profile and invoices sync across all your devices. Free forever — no spam, no data selling.
    </div>

  </div>
</div>

<script src="firebase-app.js"></script>
<script src="firebase-auth.js"></script>
<script src="firebase-firestore.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
(function(){
  'use strict';

  var mode = 'signin';
  var $ = function(id){ return document.getElementById(id); };

  function setMode(m){
    mode = m;
    document.querySelectorAll('.auth-tab').forEach(function(t){
      t.classList.toggle('is-active', t.getAttribute('data-tab') === m);
    });
    $('submitBtn').textContent = (m === 'signup') ? 'Create Account' : 'Sign In';
    $('passInput').setAttribute('autocomplete', m === 'signup' ? 'new-password' : 'current-password');
    $('forgotBtn').style.display = (m === 'signin') ? 'block' : 'none';
    hideMsg();
  }

  document.querySelectorAll('.auth-tab').forEach(function(t){
    t.addEventListener('click', function(){ setMode(t.getAttribute('data-tab')); });
  });

  function showMsg(kind, text){
    var m = $('authMsg');
    m.className = 'auth-msg show ' + kind;
    m.textContent = text;
  }
  function hideMsg(){
    var m = $('authMsg');
    m.className = 'auth-msg';
    m.textContent = '';
  }
  function setLoading(on){
    var b = $('submitBtn');
    b.disabled = !!on;
    b.textContent = on
      ? (mode === 'signup' ? 'Creating account…' : 'Signing in…')
      : (mode === 'signup' ? 'Create Account' : 'Sign In');
  }

  /* ---------- SIGN IN / SIGN UP ---------- */
  $('authForm').addEventListener('submit', function(e){
    e.preventDefault();
    var email = $('emailInput').value.trim();
    var pass = $('passInput').value;
    if (!email || !pass){ showMsg('err', 'Email aur password dono bharein.'); return; }
    if (mode === 'signup' && pass.length < 6){
      showMsg('err', 'Password kam se kam 6 characters ka hona chahiye.'); return;
    }
    setLoading(true);
    hideMsg();

    var H = window.KWAuthHelpers;
    var p = (mode === 'signup') ? H.signUp(email, pass) : H.signIn(email, pass);

    p.then(function(user){
      if (!user.emailVerified){
        showMsg('ok', '✓ Verification email bheji gayi. Inbox check karein…');
        setTimeout(function(){ location.href = 'verify.html'; }, 900);
      } else {
        showMsg('ok', '✓ Sign in successful! Loading…');
        setTimeout(function(){ location.href = 'app.html'; }, 700);
      }
    }).catch(function(err){
      showMsg('err', '✗ ' + window.KWAuthHelpers.friendlyError(err));
      setLoading(false);
    });
  });

  /* ---------- FORGOT PASSWORD ---------- */
  $('forgotBtn').addEventListener('click', function(){
    var existing = document.querySelector('.kw-overlay');
    if (existing) existing.parentNode.removeChild(existing);

    var overlay = document.createElement('div');
    overlay.className = 'kw-overlay';
    overlay.innerHTML =
      '<div class="kw-modal">' +
        '<h3>🔑 Reset Password</h3>' +
        '<p>Apna email daalein — hum password reset link bhejenge.</p>' +
        '<input type="email" id="resetEmail" placeholder="your@email.com" autocomplete="email" value="' + (document.getElementById('emailInput').value.trim() || '') + '">' +
        '<div class="kw-msg" id="resetMsg"></div>' +
        '<button class="kw-primary" id="resetSend">Send Reset Link</button>' +
        '<button class="kw-secondary" id="resetClose">Cancel</button>' +
      '</div>';
    document.body.appendChild(overlay);

    function close(){ if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }
    overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });
    $('resetClose').addEventListener('click', close);

    $('resetSend').addEventListener('click', function(){
      var email = $('resetEmail').value.trim();
      var msg = $('resetMsg');
      if (!email){
        msg.className = 'kw-msg kw-msg-err show';
        msg.textContent = 'Please enter your email';
        return;
      }
      $('resetSend').disabled = true;
      $('resetSend').textContent = 'Sending…';
      msg.className = 'kw-msg';
      window.KWAuthHelpers.sendPasswordReset(email)
        .then(function(){
          $('resetSend').disabled = false;
          $('resetSend').textContent = 'Send Reset Link';
          msg.className = 'kw-msg kw-msg-ok show';
          msg.textContent = '✓ Reset link sent! Email (aur spam) check karein.';
        })
        .catch(function(err){
          $('resetSend').disabled = false;
          $('resetSend').textContent = 'Send Reset Link';
          msg.className = 'kw-msg kw-msg-err show';
          msg.textContent = '✗ ' + window.KWAuthHelpers.friendlyError(err);
        });
    });
  });

  /* ---------- ALREADY SIGNED IN ---------- */
  if (window.KWAuthHelpers){
    window.KWAuthHelpers.onUser(function(user){
      if (user){
        if (user.emailVerified) location.href = 'app.html';
        else location.href = 'verify.html';
      }
    });
  }
})();
</script>

</body>
</html>
