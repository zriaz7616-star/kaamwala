<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>KaamWala — Invoice Builder</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <a href="index.html" class="brand"><span class="mark">KW</span></a>
  <h1 class="topbar-title">New Invoice</h1>
  <span style="width:36px"></span>
</header>

<nav class="tabs">
  <button class="tab is-active" data-tab="edit">✏️ Edit</button>
  <button class="tab" data-tab="preview">👁 Preview</button>
</nav>

<main class="app">

<section id="view-edit" class="view">

  <div class="section">
    <h2 class="section-title">Your Details</h2>
    <label class="field">
      <span>Business / Your Name</span>
      <input type="text" id="fromName" placeholder="e.g. Zeeshan Riaz" autocomplete="name">
    </label>
    <label class="field">
      <span>Email</span>
      <input type="email" id="fromEmail" placeholder="you@example.com" autocomplete="email">
    </label>
    <label class="field">
      <span>Phone</span>
      <input type="tel" id="fromPhone" placeholder="+92 3XX XXXXXXX" autocomplete="tel">
    </label>
    <label class="field">
      <span>Address <small>(optional)</small></span>
      <textarea id="fromAddress" rows="2" placeholder="City, Pakistan"></textarea>
    </label>
  </div>

  <div class="section">
    <h2 class="section-title">Bill To</h2>
    <label class="field">
      <span>Client Name</span>
      <input type="text" id="toName" placeholder="Client name">
    </label>
    <label class="field">
      <span>Email</span>
      <input type="email" id="toEmail" placeholder="client@example.com">
    </label>
    <label class="field">
      <span>Phone</span>
      <input type="tel" id="toPhone" placeholder="+92 3XX XXXXXXX">
    </label>
    <label class="field">
      <span>Address <small>(optional)</small></span>
      <textarea id="toAddress" rows="2" placeholder="Client address"></textarea>
    </label>
  </div>

  <div class="section">
    <h2 class="section-title">Invoice Details</h2>
    <div class="row">
      <label class="field">
        <span>Invoice #</span>
        <input type="text" id="invNumber">
      </label>
      <label class="field">
        <span>Date</span>
        <input type="date" id="invDate">
      </label>
    </div>
    <div class="row">
      <label class="field">
        <span>Due Date</span>
        <input type="date" id="invDue">
      </label>
      <label class="field">
        <span>Currency</span>
        <select id="invCurrency">
          <option value="PKR">PKR — Rupee</option>
          <option value="USD">USD — Dollar</option>
          <option value="AED">AED — Dirham</option>
          <option value="GBP">GBP — Pound</option>
        </select>
      </label>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title">Items</h2>
    <div id="items"></div>
    <button id="addItemBtn" class="btn btn-ghost" type="button">+ Add Item</button>
  </div>

  <div class="section">
    <h2 class="section-title">Notes</h2>
    <label class="field">
      <span>Notes <small>(optional)</small></span>
      <textarea id="invNotes" rows="3" placeholder="Payment terms, thank you message, bank details..."></textarea>
    </label>
  </div>

</section>

<section id="view-preview" class="view is-hidden">
  <div id="preview" class="invoice"></div>
</section>

</main>

<div class="actionbar">
  <button id="saveBtn" class="btn btn-primary btn-block">💾 Save Invoice</button>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
