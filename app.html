<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>KaamWala — Invoice Builder</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <a href="index.html" class="brand"><span class="mark">KW</span></a>
  <h1 class="topbar-title" id="topbarTitle">New Invoice</h1>
  <a href="history.html" style="width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.2rem;color:#0F766E" aria-label="Saved invoices" title="Saved invoices">📋</a>
  <a href="profile.html" style="width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.2rem;color:#0F766E" aria-label="Business profile" title="Business profile">🏢</a>
</header>

<input type="hidden" id="editingId" value="">

<nav class="tabs">
  <button class="tab is-active" data-tab="edit">✏️ Edit</button>
  <button class="tab" data-tab="preview">👁 Preview</button>
</nav>

<main class="app">

<!-- BUSINESS CARD (readonly, tap to edit) -->
<div id="bizCardWrap"></div>

<datalist id="kwProducts"></datalist>

<section id="view-edit" class="view">

  <div class="section">
    <h2 class="section-title">Bill To</h2>
    <label class="field">
      <span>Client Name</span>
      <input type="text" id="toName" placeholder="Client name">
    </label>
    <label class="field">
      <span>Email</span>
      <input type="email" id="toEmail" placeholder="client@example.com">
    </label>
    <label class="field">
      <span>Phone</span>
      <input type="tel" id="toPhone" placeholder="+92 3XX XXXXXXX">
    </label>
    <label class="field">
      <span>Address <small>(optional)</small></span>
      <textarea id="toAddress" rows="2" placeholder="Client address"></textarea>
    </label>
  </div>

  <div class="section">
    <h2 class="section-title">Invoice Details</h2>
    <div class="row">
      <label class="field">
        <span>Invoice #</span>
        <input type="text" id="invNumber">
      </label>
      <label class="field">
        <span>Date</span>
        <input type="date" id="invDate">
      </label>
    </div>
    <div class="row">
      <label class="field">
        <span>Due Date</span>
        <input type="date" id="invDue">
      </label>
      <label class="field">
        <span>Currency</span>
        <select id="invCurrency">
          <option value="PKR">PKR — Rupee</option>
          <option value="USD">USD — Dollar</option>
          <option value="AED">AED — Dirham</option>
          <option value="GBP">GBP — Pound</option>
        </select>
      </label>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title">Items</h2>
    <div id="items"></div>
    <button id="addItemBtn" class="btn btn-ghost" type="button">+ Add Item</button>
  </div>

  <div class="section">
    <h2 class="section-title">Notes</h2>
    <label class="field">
      <span>Notes <small>(optional)</small></span>
      <textarea id="invNotes" rows="3" placeholder="Payment terms, thank you message..."></textarea>
    </label>
  </div>

</section>

<section id="view-preview" class="view is-hidden">
  <div id="preview" class="invoice"></div>
</section>

</main>

<div class="actionbar">
  <div id="debug" class="debug"></div>
  <div class="actionbar-btns">
    <button id="saveBtn" class="btn btn-soft">💾 Save</button>
    <button id="shareBtn" class="btn btn-soft">📤 Share</button>
    <button id="pdfBtn" class="btn btn-primary">📄 PDF</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
<script>
(function(){
  window.addEventListener('load', function(){
    var raw = null;
    try { raw = sessionStorage.getItem('kw_pending_load'); } catch(e){}
    if (!raw) return;
    try { sessionStorage.removeItem('kw_pending_load'); } catch(e){}

    setTimeout(function(){
      try {
        var d = JSON.parse(raw);
        function setVal(id, v){
          var el = document.getElementById(id);
          if (!el) return;
          el.value = v == null ? '' : v;
          el.dispatchEvent(new Event('input', {bubbles:true}));
        }
        setVal('toName', d.to && d.to.name);
        setVal('toEmail', d.to && d.to.email);
        setVal('toPhone', d.to && d.to.phone);
        setVal('toAddress', d.to && d.to.address);
        setVal('invNumber', d.invoice && d.invoice.number);
        setVal('invDate', d.invoice && d.invoice.date);
        setVal('invDue', d.invoice && d.invoice.due);
        setVal('invNotes', d.invoice && d.invoice.notes);

        var curEl = document.getElementById('invCurrency');
        if (curEl && d.invoice && d.invoice.currency){
          curEl.value = d.invoice.currency;
          curEl.dispatchEvent(new Event('change', {bubbles:true}));
        }

        if (d.id){
          var editEl = document.getElementById('editingId');
          if (editEl) editEl.value = d.id;
          var titleEl = document.getElementById('topbarTitle');
          if (titleEl) titleEl.textContent = 'Editing Invoice';
        }

        var removes = document.querySelectorAll('.item-row .remove-btn');
        for (var i = 0; i < removes.length; i++) removes[i].click();

        setTimeout(function(){
          var items = (d.items || []);
          items.forEach(function(it, idx){
            if (idx > 0) document.getElementById('addItemBtn').click();
            var rows = document.querySelectorAll('.item-row');
            var row = rows[rows.length - 1];
            if (!row) return;
            row.querySelector('.item-desc').value = it.desc || '';
            row.querySelector('.item-qty').value = (it.qty != null ? it.qty : 1);
            row.querySelector('.item-rate').value = (it.rate != null ? it.rate : 0);
            row.querySelector('.item-qty').dispatchEvent(new Event('input', {bubbles:true}));
          });

          var t = document.getElementById('toast');
          if (t){
            t.textContent = '✓ Invoice loaded — Save will update';
            t.classList.add('is-on');
            setTimeout(function(){ t.classList.remove('is-on'); }, 3000);
          }
        }, 80);
      } catch(err){
        console.error('Load failed:', err);
      }
    }, 250);
  });
})();
</script>
</body>
</html>
