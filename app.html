<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>New Invoice — KaamWala</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="home.css">
</head>
<body class="invoice-body">

<header class="kw-inv-topbar">
  <a href="home.html" class="kw-inv-icon-btn" aria-label="Back">←</a>
  <div class="kw-inv-topbar-title">
    <div class="kw-inv-topbar-sub" id="topbarSub">Creating new invoice</div>
    <div class="kw-inv-topbar-main" id="topbarTitle">New Invoice</div>
  </div>
  <a href="history.html" class="kw-inv-icon-btn" aria-label="History">📋</a>
</header>

<div class="kw-inv-tabs">
  <button type="button" class="kw-inv-tab is-active" data-tab="edit">
    <span class="kw-inv-tab-icon">✏️</span> <span>Edit</span>
  </button>
  <button type="button" class="kw-inv-tab" data-tab="preview">
    <span class="kw-inv-tab-icon">👁</span> <span>Preview</span>
  </button>
</div>

<input type="hidden" id="editingId" value="">

<main class="kw-inv-main">
<datalist id="kwProducts"></datalist>

<section id="view-edit" class="kw-inv-view">

  <div class="kw-inv-card">
    <div class="kw-inv-card-head">
      <span class="kw-inv-card-icon">👤</span>
      <div class="kw-inv-card-head-text">
        <div class="kw-inv-card-title" id="billToTitle" data-i18n="customer_details">CUSTOMER DETAILS</div>
      </div>
    </div>
    <div class="kw-inv-fields">
      <label class="kw-inv-field">
        <span data-i18n="client_name">Customer Name *</span>
        <input type="text" id="toName" placeholder="e.g. Ali Khan">
      </label>
      <label class="kw-inv-field">
        <span data-i18n="phone">Phone</span>
        <input type="tel" id="toPhone" placeholder="+92 3XX XXXXXXX">
      </label>
      <label class="kw-inv-field" id="toEmailField">
        <span data-i18n="email">Email <small>(optional)</small></span>
        <input type="email" id="toEmail" placeholder="client@example.com">
      </label>
      <label class="kw-inv-field" id="toAddressField">
        <span data-i18n="address">Address <small>(optional)</small></span>
        <textarea id="toAddress" rows="2" placeholder="Street, City"></textarea>
      </label>
    </div>
  </div>

  <div class="kw-inv-card">
    <div class="kw-inv-card-head">
      <span class="kw-inv-card-icon">🛒</span>
      <div class="kw-inv-card-head-text">
        <div class="kw-inv-card-title" data-i18n="items">ITEMS</div>
      </div>
    </div>
    <div id="items" class="kw-inv-items"></div>
    <div class="kw-inv-items-actions">
      <button type="button" id="searchProductBtn" class="kw-inv-btn-search" data-i18n="search">🔍 Search</button>
      <button type="button" id="addItemBtn" class="kw-inv-btn-add" data-i18n="add_item">+ Add Item</button>
    </div>
  </div>

  <div class="kw-inv-card" id="invoiceDetailsSection">
    <div class="kw-inv-card-head">
      <span class="kw-inv-card-icon">📄</span>
      <div class="kw-inv-card-head-text">
        <div class="kw-inv-card-title" data-i18n="invoice_details">INVOICE DETAILS</div>
      </div>
    </div>
    <div class="kw-inv-fields">
      <label class="kw-inv-field">
        <span data-i18n="invoice_num">Invoice #</span>
        <input type="text" id="invNumber">
      </label>
      <label class="kw-inv-field">
        <span data-i18n="date">Date</span>
        <input type="date" id="invDate">
      </label>
      <label class="kw-inv-field">
        <span data-i18n="due_date">Due Date</span>
        <input type="date" id="invDue">
      </label>
      <label class="kw-inv-field">
        <span data-i18n="currency">Currency</span>
        <select id="invCurrency">
          <option value="PKR">PKR — Rupee</option>
          <option value="USD">USD — Dollar</option>
          <option value="GBP">GBP — Pound</option>
          <option value="EUR">EUR — Euro</option>
          <option value="AED">AED — Dirham</option>
          <option value="SAR">SAR — Riyal</option>
          <option value="INR">INR — Indian Rupee</option>
          <option value="CNY">CNY — Chinese Yuan</option>
          <option value="RUB">RUB — Russian Ruble</option>
          <option value="TRY">TRY — Turkish Lira</option>
          <option value="IRR">IRR — Iranian Rial</option>
          <option value="BDT">BDT — Taka</option>
          <option value="AFN">AFN — Afghani</option>
          <option value="CAD">CAD — Canadian Dollar</option>
          <option value="AUD">AUD — Australian Dollar</option>
        </select>
      </label>
    </div>
  </div>

  <div class="kw-inv-card" id="paymentStatusSection">
    <div class="kw-inv-card-head">
      <span class="kw-inv-card-icon">💰</span>
      <div class="kw-inv-card-head-text">
        <div class="kw-inv-card-title" data-i18n="payment_status">PAYMENT STATUS</div>
      </div>
    </div>
    <div class="kw-inv-fields">
      <div class="kw-status-toggle">
        <label class="kw-status-opt">
          <input type="radio" name="payStatus" value="unpaid" checked>
          <span class="kw-status-pill unpaid">
            <span class="kw-status-dot"></span>
            <span class="kw-status-text" data-i18n="unpaid">Unpaid</span>
          </span>
        </label>
        <label class="kw-status-opt">
          <input type="radio" name="payStatus" value="paid">
          <span class="kw-status-pill paid">
            <span class="kw-status-dot"></span>
            <span class="kw-status-text" data-i18n="paid">Paid</span>
          </span>
        </label>
      </div>
      <div class="kw-status-hint" id="statusHint">Customer hasn't paid yet — amount due.</div>
    </div>
  </div>

  <div class="kw-inv-card">
    <div class="kw-inv-card-head">
      <span class="kw-inv-card-icon">💬</span>
      <div class="kw-inv-card-head-text">
        <div class="kw-inv-card-title" data-i18n="notes">NOTES</div>
      </div>
    </div>
    <div class="kw-inv-fields">
      <label class="kw-inv-field">
        <span data-i18n="notes_optional">Notes <small>(optional)</small></span>
        <textarea id="invNotes" rows="3" placeholder="e.g. Payment due within 14 days."></textarea>
      </label>
    </div>
  </div>

</section>

<section id="view-preview" class="kw-inv-view is-hidden">
  <div id="preview" class="invoice-paper"></div>
</section>

</main>

<div class="kw-inv-actionbar">
  <div id="debug" class="kw-inv-debug"></div>
  <div class="kw-inv-actionbar-btns">
    <button id="pdfBtn" class="kw-inv-act kw-inv-act-primary">
      <span class="kw-inv-act-icon">📄</span>
      <span class="kw-inv-act-label">PDF</span>
    </button>
    <button id="shareBtn" class="kw-inv-act">
      <span class="kw-inv-act-icon">📤</span>
      <span class="kw-inv-act-label">Share</span>
    </button>
    <button id="printBtn" class="kw-inv-act">
      <span class="kw-inv-act-icon">🖨</span>
      <span class="kw-inv-act-label">Print</span>
    </button>
    <button id="saveBtn" class="kw-inv-act kw-inv-act-success">
      <span class="kw-inv-act-icon">💾</span>
      <span class="kw-inv-act-label">Save</span>
    </button>
  </div>
</div>

<div id="kwSearchModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:9999;align-items:flex-end;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25)">
    <div style="padding:16px;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between;gap:10px">
      <h3 style="margin:0;font-size:1.1rem;font-weight:800;color:#0F172A">🔍 Search Product</h3>
      <button id="kwSearchClose" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748B;padding:4px 10px;font-family:inherit">✕</button>
    </div>
    <div style="padding:12px 16px;border-bottom:1px solid #E2E8F0">
      <input type="text" id="kwSearchInput" placeholder="Product ya service ka naam likhein…" autocomplete="off"
        style="width:100%;padding:12px 14px;border:1.5px solid #CBD5E1;border-radius:11px;font-size:16px;background:#fff;color:#0F172A;font-family:inherit;box-sizing:border-box;outline:none">
    </div>
    <div id="kwSearchList" style="flex:1;overflow-y:auto;padding:8px 16px 20px"></div>
  </div>
</div>

<div id="toast" class="kw-inv-toast"></div>

<script src="firebase-app.js"></script>
<script src="firebase-auth.js"></script>
<script src="firebase-firestore.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script src="i18n.js"></script>
<script src="fb-data.js"></script>
<script src="premium.js"></script>
<script src="app.js"></script>
</body>
</html>
