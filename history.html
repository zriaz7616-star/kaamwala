<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>Saved Invoices — KaamWala</title>
<link rel="stylesheet" href="app.css">
<style>
.history-list{display:flex;flex-direction:column;gap:10px}
.inv-card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:10px}
.inv-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.inv-card-num{font-weight:800;color:#0F172A;font-size:1rem;margin:0}
.inv-card-client{color:#64748B;font-size:.9rem;margin:2px 0 0}
.inv-card-date{color:#94A3B8;font-size:.78rem;margin:0;text-align:right;white-space:nowrap}
.inv-card-total{font-size:1.15rem;font-weight:800;color:#0F766E;margin:6px 0 0}
.inv-card-meta{color:#94A3B8;font-size:.78rem;margin:0}
.inv-card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inv-card-actions button{min-height:44px;border-radius:10px;font-weight:700;
  border:none;font-size:.92rem;cursor:pointer;font-family:inherit}
.btn-load{background:#F0FDFA;color:#0F766E;border:1.5px solid #99F6E4!important}
.btn-del{background:#FEF2F2;color:#DC2626;border:1.5px solid #FECACA!important}
.empty{text-align:center;padding:60px 20px;color:#64748B}
.empty-icon{font-size:3rem;margin-bottom:10px}
.empty h2{color:#0F172A;font-size:1.15rem;margin:0 0 6px}
.empty p{margin:0 0 20px;font-size:.95rem}
.empty .btn{display:inline-flex}
.confirm-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px}
.confirm-box{background:#fff;border-radius:16px;padding:22px;max-width:340px;width:100%;
  text-align:center}
.confirm-box h3{margin:0 0 8px;font-size:1.15rem;color:#0F172A}
.confirm-box p{margin:0 0 18px;color:#64748B;font-size:.92rem}
.confirm-box .confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.confirm-box button{min-height:48px;border-radius:11px;font-weight:700;border:none;
  cursor:pointer;font-size:.95rem;font-family:inherit}
.confirm-yes{background:#DC2626;color:#fff}
.confirm-no{background:#F1F5F9;color:#475569}
</style>
</head>
<body>

<header class="topbar">
  <a href="app.html" class="brand" aria-label="Back">
    <span class="mark">KW</span>
  </a>
  <h1 class="topbar-title">Saved Invoices</h1>
  <a href="app.html" style="width:36px;height:36px;display:inline-flex;align-items:center;
     justify-content:center;text-decoration:none;font-size:1.4rem;color:#0F766E" aria-label="New invoice">+</a>
</header>

<main class="app">
  <div id="listWrap" class="history-list"></div>
</main>

<div id="toast" class="toast"></div>






<script src="invoices-sync.js"></script>
<script src="firebase-app.js"></script>
<script src="firebase-auth.js"></script>
<script src="firebase-firestore.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="fb-data.js"></script>
<script src="history.js"></script>
<script>
(function(){ if (window.FB) window.FB.requireLogin("auth.html"); })();
</script>
<div style="text-align:center;padding:14px 0;border-top:1px solid #E2E8F0;margin-top:20px"><p style="margin:12px 0 0;font-size:.78rem"><a href="privacy.html" style="color:#0F766E;text-decoration:none;font-weight:600;margin:0 6px">Privacy</a><a href="terms.html" style="color:#0F766E;text-decoration:none;font-weight:600;margin:0 6px">Terms</a></p></div>
</body>
</html>
